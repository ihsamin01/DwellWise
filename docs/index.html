<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DwellWise — Open rental</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
      background: #F3F4F6; color: #1F2937;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 24px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
      background: #1877F2; display: flex; align-items: center; justify-content: center;
      font-size: 38px;
    }
    h1 { font-size: 22px; color: #1877F2; margin-bottom: 6px; }
    p { color: #6B7280; font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: inline-block; width: 100%; padding: 14px 20px; border: none;
      border-radius: 10px; background: #1877F2; color: #fff;
      font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .hint { margin-top: 16px; font-size: 12px; color: #9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>DwellWise</h1>
    <p id="msg">Opening this rental in the DwellWise app…</p>
    <a class="btn" id="openBtn" href="#">Open in app</a>
    <div class="hint">If nothing happens, make sure the DwellWise app is installed.</div>
  </div>

  <script>
    // Read ?id=<propertyId> and build the app deep link.
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var appLink = id ? 'dwellwise://property/' + encodeURIComponent(id) : null;

    var btn = document.getElementById('openBtn');
    var msg = document.getElementById('msg');

    if (appLink) {
      btn.setAttribute('href', appLink);
      // Auto-attempt to open the app.
      window.location.href = appLink;
      setTimeout(function () {
        msg.textContent = 'Tap the button below to open this rental in the app.';
      }, 1200);
    } else {
      msg.textContent = 'This link is missing a property reference.';
      btn.style.display = 'none';
    }
  </script>
</body>
</html>
