name: dwell_wise
description: A professional, transparent real-estate and rental marketplace for the urban market in Bangladesh.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.0.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Database & Backend
  supabase_flutter: ^2.0.0

  # Notifications
  onesignal_flutter: ^5.0.0
  
  # Google Maps & Location
  google_maps_flutter: ^2.5.0

  # Opens the exact typed address in the Google Maps app / browser
  # (works without a Maps API key).
  url_launcher: ^6.2.0

  # AI Integration
  google_generative_ai: ^0.4.0
  
  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  file_picker: ^10.0.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  geolocator: ^14.0.3
  emoji_picker_flutter: ^4.5.3
  path_provider: ^2.1.6
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  share_plus: ^13.3.0
  app_links: ^7.2.1
  google_sign_in: 6.2.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# file_picker's Windows code needs win32 ^5 while geolocator (via the unused
# geolocator_linux -> package_info_plus 10 chain) pulls win32 ^6. Both packages'
# Windows Dart gets type-checked even for an Android build, and no single win32
# satisfies both. We force win32 5 + an older win32-5-compatible package_info_plus
# so everything compiles for Android. These are desktop-only plugins we don't
# ship, so this only matters if we ever target Windows/Linux desktop.
dependency_overrides:
  win32: ^5.13.0
  package_info_plus: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
    - assets/icons/
    - assets/avatars/
    - assets/secrets/